<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMF龙日辅助程序</title>
    <!-- 检测浏览器版本是否过旧，用src导入会导致IE浏览器直接报错，放index.js里等不到调用到就会报错 -->
    <script>
        (function () {
            var userAgent = navigator.userAgent;
            var browserName = "";
            var browserVersion = "";

            // 检测浏览器类型和版本
            if (userAgent.indexOf("Firefox") > -1) {
                browserName = "Firefox";
                browserVersion = userAgent.match(/Firefox\/(\d+)/)[1];
            } else if (userAgent.indexOf("Chrome") > -1 && userAgent.indexOf("Edge") == -1) {
                browserName = "Chrome";
                browserVersion = userAgent.match(/Chrome\/(\d+)/)[1];
            } else if (userAgent.indexOf("Safari") > -1 && userAgent.indexOf("Chrome") == -1) {
                browserName = "Safari";
                browserVersion = userAgent.match(/Version\/(\d+)/)[1];
            } else if (userAgent.indexOf("Trident") > -1) {
                browserName = "IE";
                browserVersion = userAgent.match(/rv:(\d+)/)[1];
            } else if (userAgent.indexOf("Edge") > -1) {
                browserName = "Edge";
                browserVersion = userAgent.match(/Edge\/(\d+)/)[1];
            }

            // 判断浏览器版本是否过旧
            var isOutdated = false;
            if (browserName === "IE") {
                isOutdated = true;
            } else if (browserName === "Firefox" && parseInt(browserVersion) < 60) {
                isOutdated = true;
            } else if (browserName === "Chrome" && parseInt(browserVersion) < 70) {
                isOutdated = true;
            } else if (browserName === "Safari" && parseInt(browserVersion) < 12) {
                isOutdated = true;
            } else if (browserName === "Edge" && parseInt(browserVersion) < 79) {
                isOutdated = true;
            }

            if (isOutdated) {
                if (confirm("您的浏览器版本过旧，无法保证程序的正常运行。是否跳转至现代浏览器下载界面")) {
                    window.location.href = "./low_browser.html";
                }
            }
        })();
    </script>
    <!-- jq导入 -->
    <script src="../lib/jquery.min.js"></script>
    <!-- message提示框组件 -->
    <link rel="stylesheet" href="../lib/message/message.min.css">
    <script src="../lib/message/message.min.js"></script>
    <!-- 主css样式表 -->
    <link rel="stylesheet" href="../src/assets/styles/main.css">
</head>

<body>
    <nav class="sidebar">
        <div class="sidebar-header">DMF-Plus</div>
        <ul class="sidebar-menu">
            <li class="sidebar-item active" data-section="main">主界面</li>
            <li class="sidebar-item" data-section="settings">设置</li>
            <li class="sidebar-item" data-section="help">帮助</li>
        </ul>
    </nav>
    <div class="main-content">
        <div class="main-section section" data-section="main">
            <div class="imageCalculate">
                <span class="imgSmallSpan"></span>
                <span class="imgBigSpan"></span>
            </div>
            <div class="lieCalculate">
                <label for="y1">起点的y坐标:</label>
                <input type="text" id="y1" placeholder="输入y1" value="0">
                <label for="x1">点1的x坐标:</label>
                <input type="text" id="x1" placeholder="输入x1" value="0">
                <div class="dropdown-container">
                    <div class="location-dropdown" id="startLocationDropdown">
                        <button class="dropdown-button">选择起点</button>
                        <div class="dropdown-content" id="startLocationOptions">
                            <!-- 这里将由JS动态生成选项 -->
                        </div>
                    </div>
                </div>
                <label for="y2">点2的y坐标:</label>
                <input type="text" id="y2" placeholder="输入y2" value="100">
                <label for="x2">点2的x坐标:</label>
                <input type="text" id="x2" placeholder="输入x2" value="-100">
                <div class="dropdown-container">
                    <div class="location-dropdown" id="endLocationDropdown">
                        <button class="dropdown-button">选择终点</button>
                        <div class="dropdown-content" id="endLocationOptions">
                            <!-- 这里将由JS动态生成选项 -->
                        </div>
                    </div>
                </div>
                <button id="calculateButton">计算距离</button>
                <p id="result"></p>
            </div>
            <div class="easyCalculate"></div>
        </div>
        <div class="settings-section section" data-section="settings" style="display:none;">
            <h2>设置</h2>
            <div class="setting-item">
                <label class="switch">
                    <input type="checkbox" id="autoCopySwitch">
                    <span class="slider"></span>
                </label>
                <span>计算后自动复制结果到粘贴板</span>
            </div>
            <div class="setting-item">
                <label class="switch">
                    <input type="checkbox" id="zhConvertSwitch">
                    <span class="slider"></span>
                </label>
                <span>界面简繁转换</span>
            </div>
            <!-- 可快速新增其它开关设置 -->
            <div class="setting-actions">
                <button id="applySettings">应用设置</button>
                <button id="resetSettings">重置设置</button>
            </div>
        </div>
        <div class="help-section section" data-section="help" style="display:none;">
            <h2>帮助与教程</h2>
            <div class="help-content">
                <ol>
                    <li>输入两个点的坐标，点击“计算距离”按钮，程序会自动计算两点间距离和方向。</li>
                    <li>如需自动复制结果到粘贴板，可在“设置”界面开启相关开关。</li>
                    <li>支持地图图片裁剪与放大缩小操作，鼠标移动可查看细节。</li>
                    <li>如遇异常或报错，请刷新页面或检查输入格式。</li>
                    <li>更多功能和开关可在“设置”界面快速添加。</li>
                </ol>
                <p>如有疑问或建议，请联系开发者。</p>
            </div>
        </div>
    </div>
</body>
<!-- js工具文件 -->
<script src="../src/utils/utils.js"></script>
<!-- 主js程序 -->
<script src="../src/index.js"></script>

</html>
